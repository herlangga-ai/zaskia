<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Little Blue Garden for You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Simbol bunga SVG yang dipakai ulang -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flower" viewBox="-50 -50 100 100">
      <g fill="currentColor" opacity=".92">
        <ellipse cx="0" cy="-26" rx="12" ry="22"/>
        <ellipse cx="0" cy="-26" rx="12" ry="22" transform="rotate(45)"/>
        <ellipse cx="0" cy="-26" rx="12" ry="22" transform="rotate(90)"/>
        <ellipse cx="0" cy="-26" rx="12" ry="22" transform="rotate(135)"/>
        <ellipse cx="0" cy="-26" rx="12" ry="22" transform="rotate(180)"/>
        <ellipse cx="0" cy="-26" rx="12" ry="22" transform="rotate(225)"/>
        <ellipse cx="0" cy="-26" rx="12" ry="22" transform="rotate(270)"/>
        <ellipse cx="0" cy="-26" rx="12" ry="22" transform="rotate(315)"/>
      </g>
      <circle r="11" fill="#ffe9a8"/><circle r="5" fill="#f5cf6b"/>
    </symbol>
  </svg>

  <div id="petals" aria-hidden="true"></div>
  <div id="hearts" aria-hidden="true"></div>

  <!-- Tombol musik -->
  <button id="musicBtn" class="music-btn" aria-label="Putar musik" aria-pressed="false">🎵</button>

  <!-- HALAMAN PEMBUKA: AMPLOP -->
  <section id="intro" class="intro">
    <div class="sway" id="sway">
      <button id="envelope" class="envelope" aria-label="Buka surat ulang tahun">
        <span class="env-back"></span>
        <span class="paper"><em>Untuk <b data-bind="nickname"></b> 💙</em></span>
        <span class="env-front"></span>
        <span class="flap"></span>
        <span class="seal">💙</span>
        <span class="deco d1">🌸</span><span class="deco d2">🌼</span><span class="deco d3">💙</span>
      </button>
    </div>
    <p class="tagline">For someone who makes my world bluer and more beautiful 💙</p>
    <p class="hint">Klik suratnya untuk membuka kejutanmu</p>
  </section>

  <!-- HALAMAN UTAMA -->
  <main id="main" class="main" hidden>
    <section class="letter-card">
      <figure class="photo-wrap">
        <span class="fl-deco f1">🌷</span><span class="fl-deco f2">🌼</span><span class="fl-deco f3">🦋</span><span class="fl-deco f4">🌸</span>
        <!-- GANTI FOTO: assets/images/girlfriend.jpg (atur juga di script.js > CONFIG.photo) -->
        <img id="profilePhoto" class="profile-photo" src="assets/images/girlfriend.jpg" alt="Foto dia">
      </figure>
      <h1 id="title" class="title"></h1>
      <p class="date" id="dateText"></p>
      <div id="letterText" class="letter-text" aria-live="polite"></div>
      <div class="btn-row">
        <button class="btn" id="readBtn">Baca suratku 💌</button>
        <button class="btn ghost" id="secretBtn">Klik untuk pesan rahasia</button>
        <button class="btn ghost" id="replayBtn">Putar ulang ↻</button>
      </div>
      <div id="secretCard" class="secret-card" hidden></div>
    </section>

    <section class="garden" id="garden">
      <h2>A Little Garden of Memories 🌷</h2>
      <p class="sub">Sentuh bunganya satu per satu</p>
      <div class="flowers">
        <button class="flower-btn c1" data-modal="memories"><svg class="fl"><use href="#flower"/></svg><span>Our Memories</span></button>
        <button class="flower-btn c2" data-modal="moments"><svg class="fl"><use href="#flower"/></svg><span>Little Moments</span></button>
        <button class="flower-btn c3" data-modal="reasons"><svg class="fl"><use href="#flower"/></svg><span>Reasons I Love You</span></button>
        <button class="flower-btn c4" data-modal="wish"><svg class="fl"><use href="#flower"/></svg><span>A Wish for You</span></button>
      </div>
      <p class="footer">Dari <b data-bind="sender"></b>, dengan seluruh cinta 💙</p>
    </section>
  </main>

  <!-- MODAL -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="modalClose" class="modal-close" aria-label="Tutup">✕</button>
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
